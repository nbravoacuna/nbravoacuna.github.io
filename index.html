<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bravo-Acuña, Nicolás</title>
  <script src="script.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,500;0,700;1,500&family=Ubuntu+Condensed" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="header">

    <aside id="sidebar">
      <img id="picture" src="images/image.jpeg"
           style="display:block; margin-left:auto; margin-right:auto; border-radius:90%;" />
    </aside>

    <div class="info-header" style="text-align: center; font-size: 48px; font-weight: bold; color: #f53e3e;">NICOLÁS BRAVO ACUÑA</div>

    <div class="info-header" style="text-align: center; font-size: 12px; margin-top: 8px;">Miembro de la Sociedad Chilena de Bioinformática</div>

    <div class="info-header" style="display: grid; grid-template-columns: 20% 30% 30% 20%; font-size: 12px; margin-top: 8px;">
      <div></div>
      <div id="title-column"></div>
      <div id="degree-column"></div>
      <div></div>
    </div>

    <div class="info-header" style="margin-top: 8px"><hr style="width:80%; width:608px; border-top:2px solid #100c08;"></div>
  </div>

  <div id="body">

    <div class="info-body">
      <details>
        <summary class="click-title">
          <span>Educación</span>
          <span class="chevron"></span>
        </summary>

        <div class="click-details">
          <div id="education-container">
        </div>
      </details>
    </div>

    <div class="info-body">
      <details>
        <summary class="click-title">
          <span>Actividades de divulgación</span>
          <span class="chevron"></span>
        </summary>

        <div class="click-details">
          <div id="outreach-container">
        </div>
      </details>
    </div>

    <div class="info-body">
      <details>
        <summary class="click-title">
          <span>Artículos científicos</span>
          <span class="chevron"></span>
        </summary>

        <div class="click-details">
          <div id="papers-container">
        </div>
      </details>
    </div>

    <div class="info-body">
      <details>
        <summary class="click-title">
          <span>Pósteres científicos</span>
          <span class="chevron"></span>
        </summary>

        <div class="click-details">
          <div id="posters-container">
        </div>
      </details>
    </div>

    <div class="gallery">
      <div class="gallery-scroller">
        <div class="gallery-item">
          <img src="images/PANX1.apng"/><p>PANX1</p></div>
        <div class="gallery-item">
          <img src="images/ATP.apng"/><p>ATP</p></div>
        <div class="gallery-item">
          <img src="images/TRPV1.apng"/><p>TRPV1</p></div>
        <div class="gallery-item">
          <img src="images/Capsaicin.apng"/><p>Capsaicina</p></div>
        <div class="gallery-item">
          <img src="images/GRP94.apng"/><p>GRP94</p></div>
        <div class="gallery-item">
          <img src="images/Geldanamycin.apng"/><p>Geldanamicina</p></div>
        <div class="gallery-item">
      </div>
    </div>

  </div>

</body>
</html>
